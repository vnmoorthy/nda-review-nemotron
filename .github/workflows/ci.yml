name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install pytest
      - name: Unit tests (scorer + demo data)
        run: pytest -q tests
      - name: Download ContractNLI (CC-BY-4.0)
        run: |
          mkdir -p data && cd data
          curl -sSL -o cn.zip https://stanfordnlp.github.io/contract-nli/resources/contract-nli.zip
          unzip -q cn.zip && rm cn.zip
      - name: Rebuild demo data (re-scores all 369 outputs) and check it is unchanged
        run: |
          python tools/build_demo_data.py
          git diff --stat --exit-code demo/data
      - name: Demo prompt == training prompt
        run: node tests/test_prompt_parity.mjs
